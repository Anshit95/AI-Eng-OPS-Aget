version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: nexatech_admin
      POSTGRES_PASSWORD: nexatech_secure_password_2026
      POSTGRES_DB: nexatech_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexatech_admin -d nexatech_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://nexatech_admin:nexatech_secure_password_2026@db:5432/nexatech_ops
      - SECRET_KEY=production-secret-key-change-me-32-chars
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
    volumes:
      - app_data:/app/data

volumes:
  pgdata:
  app_data:
